<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Golf Quote Engine quote builder preview</title>
  <desc id="description">A monochrome golf holiday quote form beside a client quote summary and internal margin.</desc>
  <rect width="1200" height="760" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="50" y="49" font-family="Georgia, serif" font-size="25">Golf Quote Engine</text>
    <text x="50" y="68" font-size="9" letter-spacing="2" fill="#666">HOLIDAY QUOTATIONS</text>
    <text x="950" y="48" font-size="12" fill="#555">Quote builder</text>
    <text x="1065" y="48" font-size="12" fill="#555">Dashboard</text>
    <line x1="50" y1="86" x2="1150" y2="86" stroke="#ddd"/>
    <text x="50" y="119" font-size="10" letter-spacing="2" fill="#777">RESERVATIONS</text>
    <text x="50" y="162" font-family="Georgia, serif" font-size="39">Build a golf holiday quote</text>
    <text x="50" y="190" font-size="12" fill="#666">Create a seasonal, itemised offer for a golf trip. Supplier prices are converted to GBP.</text>
  </g>
  <rect x="50" y="218" width="700" height="496" fill="#fff" stroke="#ddd"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="72" y="253" font-family="Georgia, serif" font-size="21">A. Client</text>
    <text x="72" y="282" font-size="10" fill="#444">Client name</text>
    <rect x="72" y="291" width="656" height="37" fill="#fff" stroke="#aaa"/>
    <text x="83" y="315" font-size="12" fill="#666">Alex Morgan</text>
    <text x="72" y="353" font-family="Georgia, serif" font-size="21">B. Travellers</text>
    <text x="72" y="378" font-size="10" fill="#444">Number of travellers</text>
    <rect x="72" y="387" width="310" height="37" fill="#fff" stroke="#aaa"/>
    <text x="356" y="411" text-anchor="end" font-size="12">2</text>
    <text x="402" y="378" font-size="10" fill="#444">Number of golfers</text>
    <rect x="402" y="387" width="326" height="37" fill="#fff" stroke="#aaa"/>
    <text x="702" y="411" text-anchor="end" font-size="12">2</text>
    <text x="72" y="461" font-family="Georgia, serif" font-size="21">C. Accommodation</text>
    <text x="72" y="486" font-size="10" fill="#444">Hotel</text>
    <text x="311" y="486" font-size="10" fill="#444">Check-in</text>
    <text x="520" y="486" font-size="10" fill="#444">Check-out</text>
    <rect x="72" y="495" width="220" height="37" fill="#fff" stroke="#aaa"/>
    <text x="83" y="519" font-size="11">Aurora Belek Resort</text>
    <rect x="311" y="495" width="190" height="37" fill="#fff" stroke="#aaa"/>
    <text x="322" y="519" font-size="11">30 May 2027</text>
    <rect x="520" y="495" width="208" height="37" fill="#fff" stroke="#aaa"/>
    <text x="531" y="519" font-size="11">2 June 2027</text>
    <text x="72" y="571" font-family="Georgia, serif" font-size="19">D. Golf rounds</text>
    <rect x="72" y="584" width="656" height="42" fill="#fff" stroke="#ddd"/>
    <text x="84" y="610" font-size="11">Seaside Links</text>
    <text x="360" y="610" font-size="11">31 May 2027</text>
    <text x="680" y="610" text-anchor="end" font-size="11">2 players</text>
    <text x="72" y="667" font-family="Georgia, serif" font-size="19">E. Transfers and extras</text>
    <text x="72" y="690" font-size="10" fill="#666">CSV-driven add-ons · automatic quantities · manual overrides</text>
  </g>
  <rect x="775" y="218" width="375" height="322" fill="#fff" stroke="#111"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="796" y="250" font-family="Georgia, serif" font-size="22">Quote preview</text>
    <text x="796" y="271" font-size="10" fill="#666">Alex Morgan</text>
    <text x="796" y="287" font-size="10" fill="#666">30 May to 2 June · 3 nights</text>
    <line x1="796" y1="302" x2="1129" y2="302" stroke="#ddd"/>
    <text x="796" y="325" font-size="10">Aurora Belek Resort · Double · Peak · 2 nights</text>
    <text x="1129" y="325" text-anchor="end" font-size="10">£391.00</text>
    <text x="796" y="345" font-size="9" fill="#666">2 room nights × £195.50</text>
    <line x1="796" y1="358" x2="1129" y2="358" stroke="#eee"/>
    <text x="796" y="382" font-size="10">Aurora Belek Resort · Double · Summer · 1 night</text>
    <text x="1129" y="382" text-anchor="end" font-size="10">£161.50</text>
    <text x="796" y="402" font-size="9" fill="#666">1 room night × £161.50</text>
    <line x1="796" y1="415" x2="1129" y2="415" stroke="#eee"/>
    <text x="796" y="439" font-size="10">Seaside Links · 2 players</text>
    <text x="1129" y="439" text-anchor="end" font-size="10">£306.00</text>
    <text x="796" y="459" font-size="9" fill="#666">Season-specific price in GBP</text>
    <line x1="796" y1="478" x2="1129" y2="478" stroke="#111"/>
    <text x="796" y="509" font-size="12" font-weight="700">Total in GBP</text>
    <text x="1129" y="513" text-anchor="end" font-family="Georgia, serif" font-size="25">£858.50</text>
  </g>
  <rect x="775" y="557" width="375" height="157" fill="#fff" stroke="#aaa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="796" y="587" font-family="Georgia, serif" font-size="19">Pricing and margin</text>
    <rect x="1071" y="571" width="58" height="20" fill="#fff" stroke="#888"/>
    <text x="1100" y="585" text-anchor="middle" font-size="8" letter-spacing="1">INTERNAL</text>
    <line x1="796" y1="601" x2="1129" y2="601" stroke="#ddd"/>
    <text x="796" y="625" font-size="10" fill="#666">Total cost</text>
    <text x="1129" y="625" text-anchor="end" font-size="10">£680.00</text>
    <text x="796" y="648" font-size="10" fill="#666">Profit</text>
    <text x="1129" y="648" text-anchor="end" font-size="10">£179.50</text>
    <text x="796" y="681" font-size="10" fill="#666">Margin</text>
    <text x="1129" y="681" text-anchor="end" font-size="10">20.8%</text>
  </g>
</svg>
